<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Let's build something people come back to."><style>
text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1A1A1A; }
.muted { fill: #6B6660; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.arrow { animation: nudge 2.4s ease-in-out infinite; } @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } } .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; } @keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.35); opacity: 0; } }</style>
<defs><pattern id="g4" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9.0" cy="9.0" r="1" fill="rgba(242,237,230,0.06)"/></pattern></defs>
<rect width="840" height="210" rx="16" fill="#121111"/><rect width="840" height="210" rx="16" fill="url(#g4)"/>
<text x="40" y="58" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#E07150" style="fill:#E07150">SAY HI</text>
<text x="40" y="106" font-size="36" font-weight="600" fill="#F2EDE6" style="fill:#F2EDE6">Let's build something</text>
<text x="40" y="148" font-size="36" font-weight="600" fill="#F2EDE6" style="fill:#F2EDE6">people come back to<tspan fill="#E07150" style="fill:#E07150">.</tspan></text>
<text x="40" y="184" font-size="13.5" fill="#A59E95" style="fill:#A59E95">Open to design engineer, product designer and UX engineer roles in Europe.</text>
<g transform="translate(724 105)">
  <circle class="ring" r="44" fill="none" stroke="#E07150" stroke-width="1.5" opacity=".5"/>
